---
# cPanel "Git Version Control" dagitimi (Natro, hesap u7198936).
#
# Yalnizca KOD tasinir: 9 tema ve Network Content Studio eklentisi, WordPress
# kurulumunun wp-content klasorune. Icerik (metinler, gorseller, ayarlar)
# veritabanindadir ve panelden yonetilir; burada tasinmaz.
#
# Depo sunucuda web'e acik olmayan bir yere klonlanmali (cPanel varsayilani
# /home/u7198936/repositories/...), ASLA public_html ya da site klasorune.
# Dagitim elle tetiklenir: cPanel -> Git Version Control -> Manage ->
# Pull or Deploy -> "Update from Remote", sonra "Deploy HEAD Commit".
#
# Sunucuda rsync yok. Her klasor once yanina kopyalanir (.yeni), sonra eskisiyle
# yer degistirir: temadan silinen dosya sunucudan da gider, kopyalama yarida
# kalirsa canli klasor bozulmaz. Diger eklentiler, yuklemeler (uploads) ve dil
# dosyalari etkilenmez.
deployment:
  tasks:
    - export DEPLOYPATH=/home/u7198936/panel.sanayipalet.com/wp-content
    - test -d "$DEPLOYPATH/themes" && test -d "$DEPLOYPATH/plugins"
    - set -e; for d in themes/ahsapambalaj-theme themes/ahsapkasa-theme themes/istanbul-keresteci-theme themes/istanbulpaletci-theme themes/ithalkeresteci-theme themes/kavakkeresteci-theme themes/kereste-base themes/kocist-theme themes/sanayi-palet-theme plugins/network-content-studio; do rm -rf "$DEPLOYPATH/$d.yeni" "$DEPLOYPATH/$d.eski"; cp -R "wp-content/$d" "$DEPLOYPATH/$d.yeni"; if [ -d "$DEPLOYPATH/$d" ]; then mv "$DEPLOYPATH/$d" "$DEPLOYPATH/$d.eski"; fi; mv "$DEPLOYPATH/$d.yeni" "$DEPLOYPATH/$d"; rm -rf "$DEPLOYPATH/$d.eski"; echo "tamam $d"; done
